name: MCP tool catalogue

on:
  pull_request:
    paths:
      - 'supabase/functions/**'
      - 'scripts/mcp-tool*.mjs'
      - 'tests/**'
      - 'README.md'
      - 'package*.json'
      - '.github/workflows/mcp-tools-snapshot.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'scripts/mcp-tool*.mjs'
      - 'tests/**'
      - 'README.md'
      - 'package*.json'
      - '.github/workflows/mcp-tools-snapshot.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
