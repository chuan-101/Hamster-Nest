name: Signal Bus Consumer Cron

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  trigger-signal-bus-consumer:
    # 只在原仓库运行；Fork / 模板仓库请把下面的 URL 换成自己的项目后删掉这一行（见 docs/FORK.md）
    if: github.repository == 'chuan-101/Hamster-Nest'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger signal-bus-consumer Edge Function
        run: |
          curl --fail --show-error --silent \
            --request POST \
            --url 'https://crfhiumxzmaszkapanrb.supabase.co/functions/v1/signal-bus-consumer' \
            --header 'x-signal-bus-secret: ${{ secrets.SIGNAL_BUS_SECRET }}' \
            --header 'Content-Type: application/json' \
            --data '{"limit":20}'
